<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVision - Login</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-8 rounded-xl shadow-lg w-96 border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-emerald-400">Admin Dashboard Login</h2>
        
        <form id="loginForm" class="flex flex-col gap-4">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required class="p-3 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-emerald-400">
            <input type="password" id="password" placeholder="كلمة المرور" required class="p-3 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-emerald-400">
            <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-3 rounded transition">Sign In</button>
        </form>
        
        <p id="errorMsg" class="text-red-400 text-sm mt-3 text-center hidden"></p>
    </div>

    <script>
        // مفاتيح الربط الخاصة بك
        const SUPABASE_URL = "https://brydreaiwlbzbagsvezd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_JsfgZNNi3-rS57fg8HwfeA_k604yWcv";
        
        // إنشاء عميل الاتصال بـ Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // التعامل مع عملية تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                email: email, 
                password: password 
            });

            if (error) {
                errorMsg.innerText = "بيانات الدخول غير صحيحة!";
                errorMsg.classList.remove('hidden');
            } else {
                // حفظ مفتاح الجلسة للتوافق مع حماية الداشبورد
                sessionStorage.setItem('geovision_auth', 'true');

                // عند نجاح الدخول ينقلك تلقائياً إلى الداشبورد
                window.location.href = 'dashboard.html';
            }
        });
    </script>

</body>
</html>
